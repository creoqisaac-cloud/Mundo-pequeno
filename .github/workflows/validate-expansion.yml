name: Validar expansion nativa (sin publicar)
on:
  push:
    branches: [codex/isla-expansion-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar modulos
        run: |
          for f in native46/*.js native_joystick40.js sw.js; do node --check "$f"; done
          node tests/joystick-smoke.cjs
      - name: Probar juego real, cremallera y minijuegos
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          CHROME_PATH="$CHROME_PATH" node tests/browser-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/expansion-smoke.cjs
