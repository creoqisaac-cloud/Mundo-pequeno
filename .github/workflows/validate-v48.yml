name: Validar detalle artístico y puestito v48
on:
  push:
    branches: [fix/walesa-v48-native-art]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis del juego
        run: |
          node tests/joystick-smoke.cjs
          for f in native46/*.js; do node --check "$f"; done
      - name: Chromium móvil, isla y castillos
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          CHROME_PATH="$CHROME_PATH" node tests/browser-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/mainworld-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/expansion-smoke.cjs