name: Validar regiones caminables v47
on:
  push:
    branches: [fix/walesa-v47-native-regions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis y controles
        run: |
          for f in native46/*.js sw.js native_joystick40.js; do node --check "$f"; done
          node tests/joystick-smoke.cjs
      - name: Ejecutar Chromium móvil y pruebas de juego
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          CHROME_PATH="$CHROME_PATH" node tests/browser-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/expansion-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/mainworld-smoke.cjs