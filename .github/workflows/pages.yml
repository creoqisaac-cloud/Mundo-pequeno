name: Publicar Isla de Walesa en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener juego
        uses: actions/checkout@v4
      - name: Verificar archivos
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          grep -q 'walesa-ds-v1' index.html
      - name: Revisar JavaScript antes de publicar
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (scripts.length < 40) throw Error('Faltan scripts del juego');
          for (const [i, script] of scripts.entries()) {
            try { new vm.Script(script[1], {filename: 'index-script-'+i+'.js'}); }
            catch (error) { console.error(error); process.exit(1); }
          }
          console.log(scripts.length + ' bloques JavaScript válidos');
          NODE
      - name: Probar controles nativos sin regresiones
        run: |
          node --check native_joystick40.js
          node --check sw.js
          node tests/joystick-smoke.cjs
      - name: Probar Opciones y juego en Chromium real
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node tests/browser-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/mainworld-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/expansion-smoke.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4