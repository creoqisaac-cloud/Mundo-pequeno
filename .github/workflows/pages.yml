name: Retirar juego publico de GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Conservar codigo sin publicarlo
        uses: actions/checkout@v4
      - name: Verificar que NO se incluya el juego
        run: |
          test -s site-closed/index.html
          test ! -e site-closed/walesa_v32.js
          test ! -e site-closed/sw.js
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Sustituir sitio por pagina neutral
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site-closed
      - name: Retirar juego publico
        id: deployment
        uses: actions/deploy-pages@v4
