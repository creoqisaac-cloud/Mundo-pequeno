name: Validar metro elevado v67
on:
  push:
    branches:
      - feature/metro-elevado-estaciones-v67
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metro-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis
        run: |
          node --check metro62.js
          node --check metro63.js
          node --check metro66.js
          node --check tests/metro67-station.cjs
          node --check tests/v60-smoke.cjs
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verificar metro y guardados en Chromium móvil
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node tests/metro67-station.cjs
          CHROME_PATH="$CHROME_PATH" node tests/v60-smoke.cjs
          CHROME_PATH="$CHROME_PATH" node tests/metro66-visual.cjs
